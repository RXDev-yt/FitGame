<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RepQuest — Arcade Fitness RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-dark:#0F172A;
    --bg-deep:#0B1222;
    --card-dark:rgba(30,41,59,0.82);
    --card-solid:#1E293B;
    --card-2:#273449;
    --purple:#8B5CF6;
    --purple-deep:#6D28D9;
    --gold:#F59E0B;
    --red:#EF4444;
    --green:#10B981;
    --text:#F1F5F9;
    --dim:#94A3B8;
    --line:rgba(241,245,249,0.10);
    --grad-purple:linear-gradient(135deg,#8B5CF6,#6D28D9);
    --grad-cta:linear-gradient(135deg,#8B5CF6 10%,#F59E0B 120%);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:#070B14; color:var(--text);
    font-family:'Nunito',system-ui,sans-serif; line-height:1.5;
    display:flex; justify-content:center; overflow:hidden;
  }
  button{ font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  svg{ display:block; }
  h1,h2,h3,.hdr{ font-weight:900; text-shadow:0 3px 0 rgba(0,0,0,0.45); letter-spacing:0.01em; }

  #app{ position:relative; width:100%; max-width:430px; height:100dvh; background:var(--bg-dark); overflow:hidden; box-shadow:0 0 90px rgba(139,92,246,0.22); }
  .screen{ position:absolute; inset:0; overflow-y:auto; padding:18px 16px 108px; display:none; scrollbar-width:none; }
  .screen::-webkit-scrollbar{ display:none; }
  .screen.active{ display:block; animation:si .2s ease; }
  @keyframes si{ from{opacity:0; transform:translateY(8px);} to{opacity:1;} }

  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; font-weight:900; font-size:15px; padding:15px; border-radius:16px; width:100%; transition:transform .1s, filter .15s; text-shadow:0 2px 0 rgba(0,0,0,0.3); }
  .btn:active{ transform:scale(.97); }
  .b-purple{ background:var(--grad-purple); color:#fff; box-shadow:0 6px 18px rgba(139,92,246,.45); }
  .b-ghost{ background:var(--card-2); border:1px solid var(--line); }

  /* ---- DUEL (1v1 SPLIT SCREEN) ---- */
  #scr-duel{ padding:12px 12px calc(88px + env(safe-area-inset-bottom)); display:none; flex-direction:column; height:100%; }
  #scr-duel.active{ display:flex; }
  .duel-half{ flex:1; position:relative; border-radius:18px; overflow:hidden; border:2px solid var(--line); background:#000; min-height:0; }
  .duel-half.opp{ border-color:rgba(239,68,68,.6); }
  .duel-half.me{ border-color:rgba(139,92,246,.7); margin-top:10px; }
  .duel-half video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .pose-canvas{ position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; transform:scaleX(-1); }
  
  .feed-fake{ position:absolute; inset:0; background:linear-gradient(120deg,#131C30 30%,#1C2A47 50%,#131C30 70%); background-size:220% 100%; animation:shimmer 2.1s linear infinite; display:flex; align-items:center; justify-content:center; }
  @keyframes shimmer{ to{ background-position:-220% 0;} }
  
  .duel-ov{ position:absolute; inset:0; padding:10px; display:flex; flex-direction:column; justify-content:space-between; z-index:3; pointer-events:none; }
  .duel-top{ display:flex; align-items:center; gap:8px; }
  .live-b{ font-size:9px; font-weight:900; background:var(--red); padding:3px 8px; border-radius:99px; letter-spacing:.1em; }
  .duel-nm{ font-weight:900; font-size:13px; text-shadow:0 2px 4px rgba(0,0,0,.8); }
  .duel-lvl{ font-size:10px; font-weight:900; color:var(--gold); text-shadow:0 2px 4px rgba(0,0,0,.8); }
  .duel-reps{ align-self:flex-end; text-align:right; }
  .duel-reps .n{ font-size:38px; font-weight:900; line-height:1; text-shadow:0 3px 0 rgba(0,0,0,.5); }
  .duel-reps .l{ font-size:9px; font-weight:900; letter-spacing:.14em; color:rgba(255,255,255,.75); }
  
  .track-pill{ position:absolute; top:10px; right:10px; z-index:4; font-size:10.5px; font-weight:900; padding:6px 12px; border-radius:99px; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); }
  .track-pill.ai{ color:var(--green); }
  .track-pill.load{ color:var(--gold); }
  .track-pill.tap{ color:#C4B5FD; cursor:pointer; pointer-events:auto; }

  .duel-mid{ display:flex; align-items:center; justify-content:center; gap:12px; padding:9px 0 0; }
  .lead-tag{ font-weight:900; font-size:13px; padding:7px 15px; border-radius:99px; background:var(--card-2); border:1px solid var(--line); }
  .lead-tag.ahead{ color:var(--green); border-color:rgba(16,185,129,.5); }
  .lead-tag.behind{ color:var(--red); border-color:rgba(239,68,68,.5); }

  #nav{ position:absolute; left:0; right:0; bottom:0; z-index:40; display:flex; padding:9px 6px; background:rgba(11,18,34,.94); border-top:1px solid var(--line); }
  .nv{ flex:1; text-align:center; font-size:11px; font-weight:900; color:var(--dim); }
</style>
</head>
<body>

<div id="app">
  <!-- 1v1 DUEL SCREEN -->
  <div id="scr-duel" class="screen active">
    
    <!-- OPPONENT FRAME -->
    <div class="duel-half opp">
      <div class="feed-fake">
        <span style="font-size:12px; font-weight:900; color:var(--dim);">OPPONENT CAMERA FEED</span>
      </div>
      <div class="duel-ov">
        <div class="duel-top">
          <span class="live-b">LIVE</span>
          <div>
            <div class="duel-nm">Rival_Flex</div>
            <div class="duel-lvl">LVL 14</div>
          </div>
        </div>
        <div class="duel-reps">
          <div class="n" id="opp-rep-count">0</div>
          <div class="l">REPS</div>
        </div>
      </div>
    </div>

    <!-- MIDDLE SCORE TRACKER -->
    <div class="duel-mid">
      <div class="lead-tag" id="lead-status">TIED MATCH</div>
    </div>

    <!-- PLAYER FRAME (ME) -->
    <div class="duel-half me">
      <video id="my-video" autoplay playsinline muted></video>
      <canvas id="my-canvas" class="pose-canvas"></canvas>
      
      <div class="track-pill load" id="ai-status-pill">AI IS LOADING...</div>

      <div class="duel-ov">
        <div class="duel-top">
          <span class="live-b" style="background:var(--purple);">YOU</span>
          <div>
            <div class="duel-nm">Hero_Fitness</div>
            <div class="duel-lvl">LVL 12</div>
          </div>
        </div>
        <div class="duel-reps">
          <div class="n" id="my-rep-count">0</div>
          <div class="l">REPS</div>
        </div>
      </div>
    </div>

    <!-- CONTROLS FOR TESTING -->
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button class="btn b-purple" onclick="doRep()">+1 MY REP</button>
      <button class="btn b-ghost" onclick="doOppRep()">+1 RIVAL REP</button>
    </div>
  </div>

  <div id="nav">
    <div class="nv">1V1 ARENA MODE</div>
  </div>
</div>

<script>
  let myReps = 0;
  let oppReps = 0;
  let cameraStream = null;
  let isAiReady = false;

  const myVideo = document.getElementById('my-video');
  const myCanvas = document.getElementById('my-canvas');
  const aiPill = document.getElementById('ai-status-pill');
  const ctx = myCanvas.getContext('2d');

  async function initDuelCamera() {
    try {
      // 1. Get user camera video stream
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
        audio: false
      });
      
      myVideo.srcObject = cameraStream;

      // 2. Wait until video metadata loads and playback actually begins
      myVideo.onloadedmetadata = () => {
        myVideo.play();
        resizeCanvas();
        startPoseTracking();
      };
    } catch (err) {
      console.warn("Camera access denied or unavailable. Fallback to Tap Mode:", err);
      setAiStatus('tap', 'TAP MODE ACTIVE');
    }
  }

  function resizeCanvas() {
    myCanvas.width = myVideo.clientWidth || 300;
    myCanvas.height = myVideo.clientHeight || 200;
  }

  function setAiStatus(state, text) {
    aiPill.className = `track-pill ${state}`;
    aiPill.textContent = text;
  }

  function startPoseTracking() {
    // 3. Update UI pill state to remove "AI IS LOADING..."
    setAiStatus('ai', 'AI ACTIVE');
    isAiReady = true;

    // 4. Render skeleton overlays onto the player's stream
    requestAnimationFrame(renderPoseLoop);
  }

  function renderPoseLoop() {
    if (!isAiReady) return;

    ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);

    // Draw mock skeletal tracking nodes
    const cx = myCanvas.width / 2;
    const cy = myCanvas.height / 2;
    const t = Date.now() * 0.003;
    const offsetY = Math.sin(t) * 8;

    ctx.strokeStyle = '#F59E0B';
    ctx.lineWidth = 3;
    ctx.fillStyle = '#FCD34D';

    // Mock Head & Spine
    ctx.beginPath();
    ctx.arc(cx, cy - 30 + offsetY, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx, cy - 18 + offsetY);
    ctx.lineTo(cx, cy + 40 + offsetY);
    // Arms
    ctx.lineTo(cx - 30, cy + 10 + offsetY);
    ctx.moveTo(cx, cy + 40 + offsetY);
    ctx.lineTo(cx + 30, cy + 10 + offsetY);
    ctx.stroke();

    requestAnimationFrame(renderPoseLoop);
  }

  function doRep() {
    myReps++;
    document.getElementById('my-rep-count').textContent = myReps;
    updateLead();
  }

  function doOppRep() {
    oppReps++;
    document.getElementById('opp-rep-count').textContent = oppReps;
    updateLead();
  }

  function updateLead() {
    const status = document.getElementById('lead-status');
    if (myReps > oppReps) {
      status.textContent = `AHEAD BY ${myReps - oppReps}`;
      status.className = 'lead-tag ahead';
    } else if (oppReps > myReps) {
      status.textContent = `BEHIND BY ${oppReps - myReps}`;
      status.className = 'lead-tag behind';
    } else {
      status.textContent = 'TIED MATCH';
      status.className = 'lead-tag';
    }
  }

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('DOMContentLoaded', initDuelCamera);
</script>
</body>
</html>
