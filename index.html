<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kliky Arena — Ultra Fast 1v1 Push-Up Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<!-- MediaPipe Pose Script Imports -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<!-- PeerJS for Real-time Multiplayer -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
  :root{
    --bg-dark:#0F172A;
    --card-dark:rgba(30,41,59,0.85);
    --card-2:#273449;
    --purple:#8B5CF6;
    --gold:#F59E0B;
    --red:#EF4444;
    --green:#10B981;
    --text:#F1F5F9;
    --dim:#94A3B8;
    --line:rgba(241,245,249,0.12);
    --grad-purple:linear-gradient(135deg,#8B5CF6,#6D28D9);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:#070B14; color:var(--text);
    font-family:'Nunito',system-ui,sans-serif;
    display:flex; justify-content:center; overflow:hidden;
  }
  button, input{ font-family:inherit; color:inherit; }
  button{ background:none; border:none; cursor:pointer; }

  #app{ position:relative; width:100%; max-width:430px; height:100dvh; background:var(--bg-dark); overflow:hidden; box-shadow:0 0 90px rgba(139,92,246,0.22); }
  .screen{ position:absolute; inset:0; overflow-y:auto; padding:18px 16px 80px; display:none; scrollbar-width:none; }
  .screen.active{ display:block; animation:si .2s ease; }
  @keyframes si{ from{opacity:0; transform:translateY(8px);} to{opacity:1;} }

  .card{ background:var(--card-dark); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:13px; }
  .dim{ color:var(--dim); }
  .gold{ color:var(--gold); }
  .green{ color:var(--green); }
  .red{ color:var(--red); }

  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; font-weight:900; font-size:15px; padding:15px; border-radius:16px; width:100%; text-shadow:0 2px 0 rgba(0,0,0,0.3); transition:transform .1s; }
  .btn:active{ transform:scale(.97); }
  .b-purple{ background:var(--grad-purple); color:#fff; box-shadow:0 6px 18px rgba(139,92,246,.45); }
  .b-gold{ background:linear-gradient(135deg,#FCD34D,var(--gold)); color:#3A2503; text-shadow:none; box-shadow:0 6px 18px rgba(245,158,11,.4); }

  .target-pills{ display:flex; gap:8px; margin-top:11px; }
  .tpill{ flex:1; text-align:center; font-weight:900; font-size:12.5px; padding:10px; border-radius:11px; background:var(--card-2); border:1.5px solid transparent; color:var(--dim); cursor:pointer; }
  .tpill.sel{ border-color:var(--gold); color:var(--gold); background:rgba(245,158,11,.1); }

  .inp-box{ width:100%; padding:12px; border-radius:12px; background:var(--card-2); border:1px solid var(--line); margin-bottom:10px; text-align:center; font-weight:900; font-size:20px; letter-spacing:6px; color:var(--gold); }

  /* DUEL SCREEN */
  #scr-duel{ padding:12px 12px 20px; display:none; flex-direction:column; height:100dvh; }
  #scr-duel.active{ display:flex; }
  .duel-half{ flex:1; position:relative; border-radius:18px; overflow:hidden; border:2px solid var(--line); background:#000; min-height:0; }
  .duel-half.opp{ border-color:rgba(239,68,68,.6); }
  .duel-half.me{ border-color:rgba(139,92,246,.7); margin-top:8px; }
  .duel-half video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .pose-canvas{ position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; transform:scaleX(-1); }
  .duel-ov{ position:absolute; inset:0; padding:10px; display:flex; flex-direction:column; justify-content:space-between; z-index:3; pointer-events:none; }
  .duel-top{ display:flex; align-items:center; gap:8px; }
  .live-b{ font-size:9px; font-weight:900; background:var(--red); padding:3px 8px; border-radius:99px; letter-spacing:.1em; }
  .duel-reps{ align-self:flex-end; text-align:right; }
  .duel-reps .n{ font-size:38px; font-weight:900; line-height:1; }
  .duel-mid{ display:flex; align-items:center; justify-content:center; gap:12px; padding:6px 0; }
  .lead-tag{ font-weight:900; font-size:13px; padding:5px 14px; border-radius:99px; background:var(--card-2); border:1px solid var(--line); }
  .lead-tag.ahead{ color:var(--green); border-color:rgba(16,185,129,.5); }
  .lead-tag.behind{ color:var(--red); border-color:rgba(239,68,68,.5); }
  .status-pill{ font-size:11px; font-weight:800; padding:4px 8px; border-radius:8px; background:var(--card-2); text-align:center; margin-top:6px; }
  
  .warn-banner{ position:absolute; top:40%; left:50%; transform:translate(-50%, -50%); background:rgba(239,68,68,0.92); color:#fff; font-weight:900; font-size:13px; padding:8px 16px; border-radius:99px; z-index:10; display:none; pointer-events:none; text-align:center; box-shadow:0 4px 15px rgba(0,0,0,0.5); width: 85%; }
</style>
</head>
<body>

<div id="app">
  <!-- ARENA & ROOM SETUP -->
  <div id="scr-arena" class="screen active">
    <h2 style="margin-bottom:4px;">KLIKY DUEL (LOCKED IN)</h2>
    <p class="dim" style="margin-bottom:16px;">Ultra-sensitive tracking active.</p>

    <div class="card">
      <div style="font-weight:900; font-size:12px; color:var(--dim); margin-bottom:8px;">1. MATCH DURATION</div>
      <div class="target-pills">
        <div class="tpill sel" id="t-10" onclick="selectTime(10)">10 sec</div>
        <div class="tpill" id="t-30" onclick="selectTime(30)">30 sec</div>
        <div class="tpill" id="t-90" onclick="selectTime(90)">1m 30s</div>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:900; font-size:12px; color:var(--dim); margin-bottom:8px;">2. MULTIPLAYER ROOM</div>
      <div style="font-size:14px; font-weight:800; margin-bottom:8px; text-align:center;">
        YOUR CODE: <span class="gold" id="my-short-code" style="font-size:22px; letter-spacing:3px;">...</span>
      </div>
      <input type="text" id="friend-id-input" class="inp-box" maxlength="4" placeholder="4-DIGIT CODE">
      <button class="btn b-purple" onclick="connectToFriend()">INSTANT CONNECT</button>
      <div class="status-pill" id="conn-status" style="color:var(--dim);">Status: Disconnected</div>
    </div>

    <button class="btn b-gold" style="margin-top:10px;" onclick="startPushupMatch()">START MATCH</button>
  </div>

  <!-- 1v1 DUEL SCREEN -->
  <div id="scr-duel" class="screen">
    <div class="duel-half opp">
      <video id="opp-webcam" autoplay playsinline></video>
      <div class="duel-ov">
        <div class="duel-top">
          <span class="live-b">FRIEND</span>
        </div>
        <div class="duel-reps">
          <div class="n" id="opp-reps">0</div>
        </div>
      </div>
    </div>

    <div class="duel-mid">
      <div class="lead-tag" id="lead-indicator">TIED</div>
      <div style="font-weight:900; font-size:18px;" id="duel-time">00:10</div>
    </div>

    <div class="duel-half me">
      <video id="duel-webcam" autoplay playsinline muted></video>
      <canvas class="pose-canvas" id="poseCanvas"></canvas>
      <div class="warn-banner" id="cheat-warn">GET IN POSITION</div>
      <div class="duel-ov">
        <div class="duel-top">
          <span class="live-b" style="background:var(--purple);">YOU</span>
        </div>
        <div class="duel-reps">
          <div class="n" id="my-reps">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- VICTORY SCREEN -->
  <div id="scr-victory" class="screen" style="text-align:center;">
    <h1 style="font-size:36px; color:var(--gold); margin-top:40px;" id="vic-title">VICTORY!</h1>
    <div class="card" style="margin:20px 0;">
      <div class="dim" style="font-size:12px; font-weight:900;">YOUR PUSH-UPS</div>
      <div style="font-size:48px; font-weight:900;" id="vic-reps">0</div>
    </div>
    <button class="btn b-purple" onclick="switchTab('scr-arena')">PLAY AGAIN</button>
  </div>
</div>

<script>
  let selectedDuration = 10;
  let myReps = 0;
  let oppReps = 0;
  let timerInterval = null;
  
  let peer = null;
  let conn = null;
  let localStream = null;
  let shortCode = "";
  const ROOM_PREFIX = "kliky-v8-";

  let pushupState = "TOP";
  let minY = 1000;
  let maxY = -1000;

  function generate4DigitCode() {
    return Math.floor(1000 + Math.random() * 9000).toString();
  }

  function initPeer() {
    shortCode = generate4DigitCode();
    document.getElementById('my-short-code').innerText = shortCode;

    peer = new Peer(ROOM_PREFIX + shortCode, {
      debug: 0,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ],
        sdpSemantics: 'unified-plan'
      }
    });

    peer.on('open', () => {
      updateStatus("Ready", "var(--green)");
    });

    peer.on('connection', (c) => {
      conn = c;
      setupPeerListeners();
    });

    peer.on('call', (call) => {
      call.answer(localStream);
      call.on('stream', (remoteStream) => {
        document.getElementById('opp-webcam').srcObject = remoteStream;
      });
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') initPeer();
      else updateStatus("Retry connection", "var(--red)");
    });
  }

  function callPeer() {
    if (conn && conn.peer && localStream) {
      const call = peer.call(conn.peer, localStream);
      if (call) {
        call.on('stream', (remoteStream) => {
          document.getElementById('opp-webcam').srcObject = remoteStream;
        });
      }
    }
  }

  function updateStatus(msg, color) {
    const el = document.getElementById('conn-status');
    el.innerText = `Status: ${msg}`;
    el.style.color = color || "var(--dim)";
  }

  function connectToFriend() {
    const inputCode = document.getElementById('friend-id-input').value.trim();
    if (inputCode.length === 4) {
      updateStatus("Connecting...", "var(--gold)");
      conn = peer.connect(ROOM_PREFIX + inputCode, { 
        reliable: false, 
        serialization: 'json' 
      });
      setupPeerListeners();
    }
  }

  function setupPeerListeners() {
    conn.on('open', () => {
      updateStatus("Connected!", "var(--green)");
      callPeer();
    });

    conn.on('data', (data) => {
      if (data.type === 'REP_UPDATE') {
        oppReps = data.reps;
        document.getElementById('opp-reps').innerText = oppReps;
        updateLead();
      } else if (data.type === 'START_MATCH') {
        runMatchTimer(data.duration);
      } else if (data.type === 'REQUEST_STREAM') {
        callPeer();
      }
    });

    conn.on('close', () => {
      updateStatus("Friend left", "var(--red)");
    });
  }

  function switchTab(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function selectTime(sec) {
    selectedDuration = sec;
    document.querySelectorAll('.tpill').forEach(p => p.classList.remove('sel'));
    if (sec === 10) document.getElementById('t-10').classList.add('sel');
    if (sec === 30) document.getElementById('t-30').classList.add('sel');
    if (sec === 90) document.getElementById('t-90').classList.add('sel');
  }

  function startPushupMatch() {
    if (conn && conn.open) {
      conn.send({ type: 'START_MATCH', duration: selectedDuration });
    }
    runMatchTimer(selectedDuration);
  }

  function runMatchTimer(duration) {
    myReps = 0;
    oppReps = 0;
    pushupState = "TOP";
    document.getElementById('my-reps').innerText = '0';
    document.getElementById('opp-reps').innerText = '0';
    
    switchTab('scr-duel');
    
    if (conn && conn.open) {
      conn.send({ type: 'REQUEST_STREAM' });
      callPeer();
    }

    initMediaPipePose();

    let timeRem = duration;
    updateTimerDisplay(timeRem);

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeRem--;
      updateTimerDisplay(timeRem);

      if (timeRem <= 0) {
        clearInterval(timerInterval);
        endMatch();
      }
    }, 1000);
  }

  function updateTimerDisplay(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    document.getElementById('duel-time').innerText = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;
  }

  function countPushupRep() {
    myReps++;
    document.getElementById('my-reps').innerText = myReps;
    if (conn && conn.open) {
      conn.send({ type: 'REP_UPDATE', reps: myReps });
    }
    updateLead();
  }

  function updateLead() {
    const lead = document.getElementById('lead-indicator');
    if (myReps > oppReps) {
      lead.innerText = "AHEAD!";
      lead.className = "lead-tag ahead";
    } else if (myReps < oppReps) {
      lead.innerText = "BEHIND!";
      lead.className = "lead-tag behind";
    } else {
      lead.innerText = "TIED";
      lead.className = "lead-tag";
    }
  }

  function endMatch() {
    document.getElementById('vic-reps').innerText = myReps;
    const title = document.getElementById('vic-title');
    if (myReps >= oppReps) {
      title.innerText = "VICTORY!";
      title.className = "vic-h green";
    } else {
      title.innerText = "DEFEAT";
      title.className = "vic-h red";
    }
    switchTab('scr-victory');
  }

  function initMediaPipePose() {
    const videoElement = document.getElementById('duel-webcam');
    const canvasElement = document.getElementById('poseCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const warnEl = document.getElementById('cheat-warn');

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 0,
      smoothLandmarks: true,
      minDetectionConfidence: 0.2,
      minTrackingConfidence: 0.2
    });

    pose.onResults((results) => {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const lShoulder = results.poseLandmarks[11];
        const rShoulder = results.poseLandmarks[12];
        const lElbow = results.poseLandmarks[13];
        const rElbow = results.poseLandmarks[14];

        if (lShoulder || rShoulder) {
          warnEl.style.display = "none";
          
          // Hybrid tracker: uses relative vertical movement of shoulders
          const currentY = lShoulder ? lShoulder.y : rShoulder.y;

          if (pushupState === "TOP") {
            if (currentY > minY + 0.04) {
              pushupState = "BOTTOM";
              maxY = currentY;
            } else if (currentY < minY) {
              minY = currentY;
            }
          } else if (pushupState === "BOTTOM") {
            if (currentY < maxY - 0.03) {
              pushupState = "TOP";
              minY = currentY;
              countPushupRep();
            } else if (currentY > maxY) {
              maxY = currentY;
            }
          }

          // Draw Visual Skeleton
          canvasCtx.strokeStyle = pushupState === "BOTTOM" ? "#10B981" : "#8B5CF6";
          canvasCtx.lineWidth = 5;

          if (lShoulder && lElbow) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(lShoulder.x * canvasElement.width, lShoulder.y * canvasElement.height);
            canvasCtx.lineTo(lElbow.x * canvasElement.width, lElbow.y * canvasElement.height);
            canvasCtx.stroke();
          }

          if (rShoulder && rElbow) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(rShoulder.x * canvasElement.width, rShoulder.y * canvasElement.height);
            canvasCtx.lineTo(rElbow.x * canvasElement.width, rElbow.y * canvasElement.height);
            canvasCtx.stroke();
          }
        } else {
          warnEl.style.display = "block";
          warnEl.innerText = "MOVE INTO CAMERA VIEW";
        }
      } else {
        warnEl.style.display = "block";
        warnEl.innerText = "NO POSE DETECTED";
      }
      canvasCtx.restore();
    });

    if (!localStream) {
      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await pose.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });
      
      camera.start().then(() => {
        if (videoElement.srcObject) {
          localStream = videoElement.srcObject;
          callPeer();
        }
      });
    } else {
      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await pose.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });
      camera.start();
    }
  }

  // Pre-fetch camera on page load for faster connection
  navigator.mediaDevices?.getUserMedia({ video: true, audio: false }).then((stream) => {
    localStream = stream;
    document.getElementById('duel-webcam').srcObject = stream;
    initPeer();
  }).catch(() => {
    initPeer();
  });
</script>
</body>
</html>
